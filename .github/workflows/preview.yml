# Plan morning-digest § 3/§ 4 (ADR 0003): the preview is built and uploaded here, never committed.
# The marker comes from the repo variable LANE_MARKER. Unset the variable and run again to
# upload the same page without the marker over the same link.
name: preview
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ vars.LANE_MARKER }}
          PORT: 8787
        run: |
          pnpm start > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf localhost:8787/digest/2026-10-28 -o _site/index.html
          kill %1 || true
          test -s _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
